name: SQbricks CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  OPAMYES: "1"
  OPAMVERBOSE: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Artifacts/SQbricks/SQbricks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev pkg-config

      - name: Install OCaml dependencies
        run: opam install dune zarith landmarks benchmark lwt batteries logs menhir alcotest

      - name: Build
        run: opam exec -- dune build
